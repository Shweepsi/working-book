name = "working-book-api"
main = "src/index.ts"
compatibility_date = "2024-12-01"
account_id = "5ed16f85af827a8d3c10bc075a66e4fb"

# Two environments share the same Worker code, each bound to its own D1.
# Both databases are pre-provisioned (region WEUR) and already have the
# 0001_init.sql schema applied — `wrangler deploy --env <name>` is enough to
# ship.

[env.dev]
name = "working-book-api-dev"

[env.dev.vars]
# Supports exact origins and wildcard subdomains (*.foo.dev).
ALLOWED_ORIGINS = "http://localhost:5173,*.working-book.pages.dev"
# GridCraft shared workbooks (worker/src/grid.ts): dev only.
GRID = "on"

[[env.dev.d1_databases]]
binding = "DB"
database_name = "working-book-dev"
database_id = "67d3ea83-4067-495e-97e0-02dd46f18cbe"
migrations_dir = "migrations"

# The Suivi assistant (POST /api/grid/assist): an RPC entrypoint of the MCP
# server's Worker (wrangler.mcp.toml), which has GridCraft's engine and the
# Claude API key. Not on the internet: only this binding reaches it.
[[env.dev.services]]
binding = "ASSIST"
service = "working-book-mcp-dev"
entrypoint = "Assist"

[env.production]
name = "working-book-api"

[env.production.vars]
ALLOWED_ORIGINS = "https://working-book.pages.dev,*.working-book.pages.dev"

[[env.production.d1_databases]]
binding = "DB"
database_name = "working-book-prod"
database_id = "98426291-1638-4dfa-94a7-63109c5300fc"
migrations_dir = "migrations"
