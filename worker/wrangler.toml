name = "working-book-api"
main = "src/index.ts"
compatibility_date = "2024-12-01"

# Two environments share the same Worker code but bind to separate D1 databases.
# Replace the `database_id` placeholders below with the IDs returned by:
#   wrangler d1 create working-book-dev
#   wrangler d1 create working-book-prod

[env.dev]
name = "working-book-api-dev"

[env.dev.vars]
# Comma-separated list of allowed origins (no spaces). Set to "*" only for local hacking.
ALLOWED_ORIGINS = "http://localhost:5173,https://shweepsi.github.io"

[[env.dev.d1_databases]]
binding = "DB"
database_name = "working-book-dev"
database_id = "REPLACE_WITH_DEV_D1_ID"
migrations_dir = "migrations"

[env.production]
name = "working-book-api"

[env.production.vars]
ALLOWED_ORIGINS = "https://working-book.pages.dev"

[[env.production.d1_databases]]
binding = "DB"
database_name = "working-book-prod"
database_id = "REPLACE_WITH_PROD_D1_ID"
migrations_dir = "migrations"
