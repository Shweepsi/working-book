<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>Working Book</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        width: 320px;
        margin: 0;
        padding: 14px 16px 16px;
        font: 13px/1.5 system-ui, -apple-system, Segoe UI, sans-serif;
      }
      header { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
      h1 { font-size: 14px; margin: 0; }
      .version { font-size: 11px; opacity: 0.55; }
      .criteria {
        margin: 10px 0 12px;
        padding: 8px 10px;
        border: 1px solid rgba(128, 128, 128, 0.35);
        border-radius: 6px;
        font-size: 12px;
        opacity: 0.85;
        white-space: pre-wrap;
      }
      button {
        width: 100%;
        padding: 9px 12px;
        border: 1px solid rgba(128, 128, 128, 0.5);
        border-radius: 6px;
        background: transparent;
        color: inherit;
        font: inherit;
        cursor: pointer;
      }
      button.primary { background: #2e7d32; border-color: #2e7d32; color: #fff; font-weight: 600; }
      button.second { margin-top: 6px; }
      button[disabled] { opacity: 0.55; cursor: default; }
      #status { white-space: pre-wrap; font-size: 12px; min-height: 18px; margin-top: 10px; }
      #status:empty { display: none; }
      .result {
        margin-top: 12px;
        padding: 10px 12px;
        border-radius: 6px;
        border-left: 4px solid var(--tone);
        background: color-mix(in srgb, var(--tone) 10%, transparent);
      }
      .result[hidden] { display: none; }
      .result.ok { --tone: #2e7d32; }
      .result.warn { --tone: #ed6c02; }
      .result.err { --tone: #c62828; }
      @media (prefers-color-scheme: dark) {
        .result.ok { --tone: #66bb6a; }
        .result.warn { --tone: #ffa726; }
        .result.err { --tone: #ef5350; }
      }
      .verdict { font-weight: 600; font-size: 14px; color: var(--tone); }
      .headline { margin-top: 2px; }
      .reasons { margin: 6px 0 0; padding-left: 18px; font-size: 12px; }
      .reasons:empty { display: none; }
      .more { margin-top: 6px; font-size: 11px; opacity: 0.6; }
    </style>
  </head>
  <body>
    <header>
      <h1>Working Book</h1>
      <span class="version" id="version"></span>
    </header>

    <div class="criteria" id="criteria">Chargement des réglages…</div>

    <button id="search" type="button">Lancer la recherche</button>
    <button id="run" class="primary second" type="button">Rapport auto</button>

    <div id="status" aria-live="polite"></div>

    <div id="result" class="result" hidden aria-live="polite">
      <div class="verdict" id="verdict"></div>
      <div class="headline" id="headline"></div>
      <ul class="reasons" id="reasons"></ul>
      <div class="more">Détail complet : clic droit sur l’icône → Options.</div>
    </div>

    <script src="config.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
