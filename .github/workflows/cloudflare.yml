name: Deploy to Cloudflare

on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md']
  pull_request:
    branches: [main]
    paths-ignore: ['**/*.md']
  workflow_dispatch:

concurrency:
  group: cloudflare-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    name: Check Cloudflare credentials
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - id: check
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$TOKEN" ] && [ -n "$ACCOUNT" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Cloudflare credentials missing — skipping deploy. Configure CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in repo Settings → Secrets (see worker/README.md)."
          fi

  worker:
    name: Deploy Workers (dev + prod)
    needs: preflight
    # Only redeploy Workers on pushes to main — PRs reuse the already-deployed Workers.
    if: needs.preflight.outputs.configured == 'true' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - working-directory: worker
        run: npm ci
      - name: Apply D1 migrations (dev)
        working-directory: worker
        run: npx wrangler d1 migrations apply working-book-dev --env dev --remote
      - name: Deploy Worker (dev)
        working-directory: worker
        run: npx wrangler deploy --env dev
      - name: Apply D1 migrations (production)
        working-directory: worker
        run: npx wrangler d1 migrations apply working-book-prod --env production --remote
      - name: Deploy Worker (production)
        working-directory: worker
        run: npx wrangler deploy --env production

  pages:
    name: Build and deploy to Cloudflare Pages
    needs: preflight
    if: needs.preflight.outputs.configured == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
        env:
          # main → prod Worker + D1 prod; any branch/PR → dev Worker + D1 dev.
          VITE_API_URL: ${{ github.ref == 'refs/heads/main' && secrets.VITE_API_URL_PROD || secrets.VITE_API_URL_DEV }}
      - name: Create Pages project (idempotent — no-op if already exists)
        run: npx wrangler@3.114.17 pages project create working-book --production-branch=main || true
      - name: Deploy to Cloudflare Pages
        id: deploy
        run: |
          BRANCH="${{ github.head_ref || github.ref_name }}"
          OUTPUT=$(npx wrangler@3.114.17 pages deploy dist --project-name=working-book --branch="$BRANCH" 2>&1)
          echo "$OUTPUT"
          # Extract the deployment URL from wrangler output (e.g. "https://abc123.working-book.pages.dev")
          URL=$(echo "$OUTPUT" | grep -oE 'https://[a-f0-9]+\.working-book\.pages\.dev' | tail -1)
          echo "preview_url=${URL}" >> "$GITHUB_OUTPUT"

      - name: Comment preview URL on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const url = '${{ steps.deploy.outputs.preview_url }}';
            const marker = '<!-- cf-preview-url -->';
            const body = `${marker}\n\u{1F310} **Cloudflare Pages preview:** ${url}`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
