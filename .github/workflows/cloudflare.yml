name: Deploy to Cloudflare

on:
  push:
    branches: ['**']
    paths-ignore: ['**/*.md']
  pull_request:
    branches: [main]
    paths-ignore: ['**/*.md']
  workflow_dispatch:

concurrency:
  group: cloudflare-${{ github.ref }}
  cancel-in-progress: true

env:
  WRANGLER: npx wrangler@3.114.17

jobs:
  preflight:
    name: Check Cloudflare credentials
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - id: check
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$TOKEN" ] && [ -n "$ACCOUNT" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Cloudflare credentials missing — skipping deploy. Configure CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in repo Settings → Secrets (see worker/README.md)."
          fi

  worker-dev:
    name: Deploy Worker (dev)
    needs: preflight
    # Feature-branch pushes and workflow_dispatch redeploy dev so PR previews
    # always hit a Worker built from the same commit as the Pages bundle.
    # PRs duplicate the head-branch push and are skipped here.
    if: needs.preflight.outputs.configured == 'true' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      - name: Apply D1 migrations (dev)
        run: npx wrangler d1 migrations apply working-book-dev --env dev --remote
      - name: Deploy Worker (dev)
        run: npx wrangler deploy --env dev

  worker-prod:
    name: Deploy Worker (prod)
    needs: preflight
    # Prod stays main-only — feature branches only touch dev — but a manual run
    # counts as much as a push. Without that, `workflow_dispatch` was a trap: it
    # deploys Pages (prod, since the ref is main) while skipping this job, so
    # the one button offered for a manual deploy shipped a front against the
    # Worker and the migrations of the previous release. The `github.ref` test
    # is what keeps PRs out — their ref is refs/pull/N/merge.
    if: >-
      needs.preflight.outputs.configured == 'true'
      && github.ref == 'refs/heads/main'
      && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      - name: Apply D1 migrations (production)
        run: npx wrangler d1 migrations apply working-book-prod --env production --remote
      - name: Deploy Worker (production)
        run: npx wrangler deploy --env production

  pages:
    name: Build and deploy to Cloudflare Pages
    # The front goes out after the Worker it talks to, never beside it. Run in
    # parallel, a bundle that knows a new route can reach a Worker that doesn't
    # have it yet: the client's sync queue is FIFO and retries a failed write
    # forever, so one 404 on a new partition stalls every other partition —
    # logbook included — until the Worker lands. Seconds, self-healing, and
    # entirely avoidable by waiting.
    needs: [preflight, worker-dev, worker-prod]
    # `needs` alone would skip this job whenever a Worker job is skipped, which
    # is the normal case: prod on branches, both on PRs. `!cancelled()` turns
    # that into "run unless the run is being torn down", and the two result
    # tests keep the only case worth stopping for — a Worker that tried and
    # failed, which must not get a newer front pointed at it.
    #
    # Bracketed rather than dotted: a hyphen in a property path is ambiguous
    # with subtraction, and a mis-parse here would read as false and quietly
    # stop deploying anything at all.
    if: >-
      !cancelled()
      && needs.preflight.outputs.configured == 'true'
      && needs['worker-dev'].result != 'failure'
      && needs['worker-prod'].result != 'failure'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
        env:
          # main → prod Worker + D1 prod; any branch/PR → dev Worker + D1 dev.
          VITE_API_URL: ${{ github.ref == 'refs/heads/main' && secrets.VITE_API_URL_PROD || secrets.VITE_API_URL_DEV }}
          # Same split, named for the front end: the preview-only tabs (Logbook,
          # Test, Cosmétique) ship with the dev Worker and nowhere else.
          VITE_CHANNEL: ${{ github.ref == 'refs/heads/main' && 'prod' || 'dev' }}
      - name: Create Pages project (idempotent — no-op if already exists)
        run: ${{ env.WRANGLER }} pages project create working-book --production-branch=main || true
      - name: Deploy to Cloudflare Pages
        id: deploy
        run: |
          BRANCH="${{ github.head_ref || github.ref_name }}"
          OUTPUT=$(${{ env.WRANGLER }} pages deploy dist --project-name=working-book --branch="$BRANCH" 2>&1)
          echo "$OUTPUT"
          URL=$(echo "$OUTPUT" | grep -oE 'https://[a-f0-9]+\.working-book\.pages\.dev' | tail -1)
          if [ -z "$URL" ]; then
            echo "::error::Could not extract deployment URL from wrangler output"
            exit 1
          fi
          echo "preview_url=${URL}" >> "$GITHUB_OUTPUT"
          echo "### 🌐 Cloudflare Pages preview" >> "$GITHUB_STEP_SUMMARY"
          echo "${URL}" >> "$GITHUB_STEP_SUMMARY"

      - name: Comment preview URL on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const url = '${{ steps.deploy.outputs.preview_url }}';
            const marker = '<!-- cf-preview-url -->';
            const body = `${marker}\n🌐 **Cloudflare Pages preview:** ${url}`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
